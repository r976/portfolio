<article class="project-card" data-tags="{{ delimit .Params.tags "," | lower }}">

  {{ $thumb := .Params.thumbnail | default .Params.image }}

  {{ with $thumb }}
  <a href="{{ $.RelPermalink }}" class="project-card-image-link">
    <img
      src="{{ . | relURL }}"
      alt="{{ $.Title }}"
      class="project-card-image"
      loading="lazy"
    >
  </a>
  {{ end }}

  <div class="project-card-content">

    <div class="card-top mono">
      <span>{{ .Params.status | default "Project" }}</span>
      <span>{{ .Date.Format "2006" }}</span>
    </div>

    <h3>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    </h3>

    <p>{{ .Params.summary }}</p>

    <div class="tag-row">
      {{ range .Params.tags }}
      <span class="tag">{{ . }}</span>
      {{ end }}
    </div>

    <a
      class="card-link"
      href="{{ .RelPermalink }}"
      aria-label="View {{ .Title }}"
    >
      View project →
    </a>

  </div>
</article>
